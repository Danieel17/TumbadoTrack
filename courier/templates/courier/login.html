{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · TumbadoTrack</title>
    <link rel="icon" type="image/png" href="{% static 'courier/img/logo.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <script>
        (function () {
            var saved = localStorage.getItem('tumbadotrack-theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        brand: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        teal: {
                            50: '#DCF2F0', 100: '#A9DFD8', 200: '#73CABE', 300: '#3AB4A4',
                            400: '#00A391', 500: '#00927E', 600: '#008572', 700: '#007662',
                            800: '#006654', 900: '#004A38',
                        },
                        stone: {
                            50: '#F8F8F8', 100: '#EFEFEF', 200: '#E8E8E8', 300: '#D9D9D9',
                            400: '#D2D2D2', 500: '#A0A0A0', 600: '#87888C', 700: '#2C2D33',
                            800: '#1D1E26', 900: '#171821',
                        },
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-stone-100 text-stone-800 dark:bg-stone-900 dark:text-stone-200 min-h-screen flex items-center justify-center px-4 transition-colors">

    <button id="theme-toggle" type="button"
            class="fixed top-5 right-5 p-2 rounded-full border border-stone-200 dark:border-stone-700 text-stone-500 dark:text-stone-300 hover:text-teal-500 dark:hover:text-teal-400 hover:border-teal-400 transition-colors"
            aria-label="Cambiar tema claro/oscuro">
        <svg id="icon-sun" class="hidden dark:block h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5m0 15V21m9-9h-1.5m-15 0H3m15.364-6.364-1.06 1.06M6.696 17.304l-1.06 1.06m0-12.728 1.06 1.06M17.304 17.304l1.06 1.06M16.5 12a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z" />
        </svg>
        <svg id="icon-moon" class="block dark:hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
    </button>

    <div class="w-full max-w-md">
        <div class="flex flex-col items-center mb-6">
            <img src="{% static 'courier/img/logo.png' %}" alt="TumbadoTrack" class="h-16 w-16 object-contain mb-3">
            <p class="font-brand text-2xl font-bold tracking-tight text-teal-700 dark:text-teal-300">TumbadoTrack</p>
            <p class="text-xs text-stone-500 dark:text-stone-400">Music Pro Company · Courier</p>
        </div>

        <div class="bg-white border border-stone-200 dark:bg-stone-800 dark:border-stone-700 rounded-lg p-8">
            <h1 class="text-xl font-semibold text-center text-stone-900 dark:text-stone-100 mb-6">Iniciar sesión</h1>

            {% if error %}
            <p class="mb-4 text-sm text-center text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-500/10 border border-rose-200 dark:border-rose-500/30 rounded-md py-2 px-3">
                {{ error }}
            </p>
            {% endif %}

            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label for="usuario" class="block text-xs uppercase tracking-wide text-stone-500 dark:text-stone-400 mb-1">Usuario</label>
                    <input type="text" id="usuario" name="usuario" autocomplete="username" required
                           class="w-full rounded-md border border-stone-300 dark:border-stone-600 bg-stone-50 dark:bg-stone-700 text-stone-900 dark:text-stone-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400">
                </div>
                <div>
                    <label for="password" class="block text-xs uppercase tracking-wide text-stone-500 dark:text-stone-400 mb-1">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required
                           class="w-full rounded-md border border-stone-300 dark:border-stone-600 bg-stone-50 dark:bg-stone-700 text-stone-900 dark:text-stone-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400">
                </div>
                <button type="submit"
                        class="w-full bg-teal-500 hover:bg-teal-600 text-white font-medium text-sm rounded-md py-2.5 transition-colors">
                    Entrar
                </button>
            </form>

            <p class="mt-6 text-xs text-center text-stone-400 dark:text-stone-500">
                Acceso de administrador de prueba · usuario <span class="font-mono">admin</span> / contraseña <span class="font-mono">admin123</span>
            </p>
            <p class="mt-2 text-xs text-center text-stone-400 dark:text-stone-500">
                <a href="{% url 'courier:landing' %}" class="hover:text-teal-500 dark:hover:text-teal-400 transition-colors">&larr; Volver al inicio</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('theme-toggle').addEventListener('click', function () {
            var root = document.documentElement;
            root.classList.toggle('dark');
            localStorage.setItem('tumbadotrack-theme', root.classList.contains('dark') ? 'dark' : 'light');
        });
    </script>
</body>
</html>
